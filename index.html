<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Oficial - Irmo Neto (AdSense Ready)</title>

    <!-- Configuração do Tailwind CSS para estilo responsivo e moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Define a fonte Inter para o corpo */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Estilo para simular o espaço do anúncio (cor verde para destaque) */
        .ads-placeholder {
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed #22c55e; /* Borda verde */
            color: #16a34a; /* Texto verde escuro */
            background-color: #f0fdf4; /* Fundo verde claro */
            border-radius: 0.75rem;
            width: 100%;
            max-width: 728px; 
            margin: 2rem auto;
        }
    </style>

    <!-- 🔹 CÓDIGO DO ADSENSE PARA AUTO ADS (Corretamente no <head>) -->
    <script async
        src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2957847231347233"
        crossorigin="anonymous"></script>

</head>
<body class="bg-blue-50 min-h-screen flex flex-col items-center p-6 text-gray-800">
    
    <div class="max-w-4xl w-full p-8 bg-white shadow-xl rounded-2xl text-center">
        <!-- Título principal -->
        <h1 class="text-4xl font-extrabold text-blue-700 mb-4">Olá!!! - Você está na Página Oficial de Irmo Zuccato Neto</h1>
        
        <!-- Texto de descrição atualizado -->
        <p class="text-lg mb-6 text-gray-600">
            Escolha um dos meus aplicativos ou infoprodutos abaixo para explorar.
        </p>

        <!--
        ******************************************************************
        1. ANÚNCIO MANUAL DE DISPLAY (RECOMENDADO PARA PÁGINAS SIMPLES)
        ******************************************************************
        - Use este bloco para colocar um anúncio manual.
        - Substitua 'YOUR_SLOT_ID' pelo ID de slot criado no painel do AdSense.
        - A div 'ads-placeholder' será ocultada quando o AdSense carregar.
        -->
        <div class="my-8 flex justify-center w-full">
             <div class="ads-placeholder">
                <p class="font-bold text-lg">ÁREA PARA ANÚNCIO MANUAL DE DISPLAY (Substitua este div)</p>
            </div>
            
            <ins class="adsbygoogle hidden"
                style="display:block; text-align:center;"
                data-ad-client="ca-pub-2957847231347233"
                data-ad-slot="YOUR_SLOT_ID"
                data-ad-format="auto"
                data-full-width-responsive="true"></ins>
            <script>
                // Lógica para carregar o AdSense no ambiente real e mostrar placeholder na visualização
                if (typeof adsbygoogle !== 'undefined' && window.location.host !== 'localhost' && window.location.host !== '127.0.0.1') {
                    document.querySelector('.ads-placeholder').style.display = 'none';
                    document.querySelector('.adsbygoogle').classList.remove('hidden');
                    (adsbygoogle = window.adsbygoogle || []).push({});
                } else {
                    document.querySelector('.adsbygoogle').style.display = 'none';
                }
            </script>
        </div>
        <!-- Fim do Anúncio Manual -->

        <!-- Links -->
        <div class="flex flex-col space-y-4 items-center mt-8">
            <a href="https://irmoneto.github.io/Analisador-Personalidade-Pes/" target="_blank"
               class="w-full max-w-sm bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-lg shadow-md transition duration-300 transform hover:scale-[1.02]">
                🔍 Analisador da Personalidade pelos Pés
            </a>

            <!-- LINK do botão de Infoprodutos ATUALIZADO -->
            <a href="https://irmoneto.github.io/INFOPRODUTOS-BY-IRMONETO/" target="_blank"
               class="w-full max-w-sm bg-orange-600 hover:bg-orange-700 text-white font-semibold py-3 px-6 rounded-lg shadow-md transition duration-300 transform hover:scale-[1.02]">
                📘 Infoprodutos disponíveis sobre meus estudos
            </a>
        </div>
    </div>
</body>
</html>
