<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Oficial - Irmo Neto (AdSense Ready)</title>

    <!-- Configuração do Tailwind CSS para estilo responsivo e moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Define a fonte Inter para o corpo */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Estilo para simular o espaço do anúncio (cor verde para destaque) */
        .ads-placeholder-manual {
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed #22c55e; /* Borda verde */
            color: #16a34a; /* Texto verde escuro */
            background-color: #f0fdf4; /* Fundo verde claro */
            border-radius: 0.75rem;
            width: 100%;
            max-width: 728px; 
            margin: 2rem auto;
            /* Garante que o placeholder seja escondido quando o AdSense carregar */
            display: flex;
        }
    </style>

    <!-- 🟢 CÓDIGO DO ADSENSE PARA AUTO ADS (Anúncios Automáticos) -->
    <!-- Este script, por si só, ativa os anúncios automáticos em toda a página. -->
    <script async
        src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2957847231347233"
        crossorigin="anonymous"></script>

</head>
<body class="bg-blue-50 min-h-screen flex flex-col items-center p-6 text-gray-800">
    
    <!-- O PRIMEIRO E ÚNICO CONTAINER -->
    <div class="max-w-4xl w-full p-8 bg-white shadow-xl rounded-2xl text-center">
        <!-- Título principal -->
        <h1 class="text-4xl font-extrabold text-blue-700 mb-4">Olá!!! - Você está na Página Oficial de Irmo Zuccato Neto</h1>
        
        <!-- Texto de descrição atualizado -->
        <p class="text-lg mb-6 text-gray-600">
            Escolha um dos meus aplicativos ou infoprodutos abaixo para explorar.
        </p>

        <!-- Placeholder para Anúncios Automáticos -->
        <div class="my-8 ads-placeholder-manual">
            <p class="font-bold text-base text-center">
                ÁREA RESERVADA PARA ANÚNCIOS AUTOMÁTICOS DO ADSENSE (Auto Ads)
            </p>
        </div>


        <!-- Links -->
        <div class="flex flex-col space-y-4 items-center mt-8">
            <a href="https://irmoneto.github.io/Analisador-Personalidade-Pes/" target="_blank"
               class="w-full max-w-sm bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-lg shadow-xl transition duration-300 transform hover:scale-[1.02] active:scale-[0.98]">
                Analisador da Personalidade pelos Pés
            </a>

            <!-- LINK do botão de Infoprodutos ATUALIZADO -->
            <a href="https://irmoneto.github.io/INFOPRODUTOS-BY-IRMONETO/" target="_blank"
               class="w-full max-w-sm bg-orange-600 hover:bg-orange-700 text-white font-semibold py-3 px-6 rounded-lg shadow-xl transition duration-300 transform hover:scale-[1.02] active:scale-[0.98]">
                Infoprodutos disponíveis sobre meus estudos
            </a>
        </div>
    </div>
    
</body>
</html>
